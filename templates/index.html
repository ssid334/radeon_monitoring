<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MI50 Monitor</title>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117; color: #e1e4e8;
            padding: 24px; min-height: 100vh;
        }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
        h1 small { font-size: 0.8rem; color: #8b949e; font-weight: 400; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .cell { min-height: 100px; }

        .card {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            padding: 20px;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 16px; padding-bottom: 12px;
            border-bottom: 1px solid #21262d;
        }
        .card-header h2 { font-size: 1rem; font-weight: 600; }
        .card-header .sub { font-size: 0.75rem; color: #8b949e; margin-top: 2px; }
        .card-header .badge {
            background: #1f6feb22; color: #58a6ff; padding: 3px 10px;
            border-radius: 20px; font-size: 0.7rem; border: 1px solid #1f6feb44;
        }

        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .metric-box {
            background: #0d1117; border-radius: 8px; padding: 10px 12px;
            border: 1px solid #21262d;
        }
        .metric-box .label { font-size: 0.65rem; text-transform: uppercase; color: #8b949e; letter-spacing: 0.5px; }
        .metric-box .value { font-size: 1.3rem; font-weight: 700; margin-top: 2px; }
        .metric-box .value .unit { font-size: 0.75rem; font-weight: 400; color: #8b949e; }
        .temp-hot .value { color: #f85149; }
        .temp-warm .value { color: #d29922; }
        .temp-cool .value { color: #3fb950; }

        .bar-row { margin-bottom: 12px; }
        .bar-row .bar-label { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 4px; }
        .bar-row .bar-label span:last-child { color: #8b949e; font-weight: 600; }
        .bar-track { background: #21262d; border-radius: 6px; height: 10px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s ease; }
        .bar-fill.green { background: linear-gradient(90deg, #3fb950, #56d364); }
        .bar-fill.blue { background: linear-gradient(90deg, #1f6feb, #58a6ff); }
        .bar-fill.orange { background: linear-gradient(90deg, #d29922, #e3b341); }
        .bar-fill.red { background: linear-gradient(90deg, #da3633, #f85149); }

        .chart-container { height: 70px; margin-top: 8px; }

        .fan-row { display: flex; gap: 16px; font-size: 0.75rem; color: #8b949e; margin-top: 8px; }
        .fan-row span { display: flex; align-items: center; gap: 4px; }

        .card { cursor: grab; user-select: none; }
        .card:active { cursor: grabbing; }
        .card.dragging { opacity: 0.4; }
        .card.drag-over { border-color: #58a6ff; box-shadow: 0 0 0 2px #1f6feb88; }
        .drag-handle { cursor: grab; color: #484f58; margin-right: 6px; font-size: 1rem; }

        .drop-zone {
            border: 2px dashed #30363d; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #484f58; font-size: 0.8rem;
            transition: border-color 0.2s, background 0.2s;
        }
        .drop-zone.drag-over { border-color: #58a6ff; background: #1f6feb11; }

        .footer { text-align: center; margin-top: 24px; font-size: 0.7rem; color: #484f58; }
        .footer a { color: #58a6ff; text-decoration: none; }
        .updated { float: right; font-size: 0.7rem; color: #484f58; font-weight: 400; }
    </style>
</head>
<body>
<h1>GPU Monitor <small>Radeon Instinct MI50</small></h1>
<div class="grid" id="gpuGrid"></div>
<div class="footer">Polling every 2s &middot; <span id="updatedLabel">updating...</span></div>

    <script>
const CHARTS = {};
let dragSrcId = null;
const COLS = 2;

// ---- position persistence ----

function loadPositions(cards) {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem('gpuPositions') || '{}'); } catch {}
    const map = {};
    for (const c of cards) map[c.id] = c;
    const result = {};  // "row-col" → card id
    const used = new Set();
    for (const c of cards) {
        if (saved[c.id] && !used.has(saved[c.id])) {
            result[saved[c.id]] = c.id;
            used.add(saved[c.id]);
        }
    }
    // place any unknown cards into the first free cell
    let row = 1, col = 1;
    for (const c of cards) {
        if (!saved[c.id] || used.has(saved[c.id]) && result[saved[c.id]] !== c.id) {
            while (used.has(row + '-' + col)) {
                col++;
                if (col > COLS) { col = 1; row++; }
            }
            const cell = row + '-' + col;
            result[cell] = c.id;
            saved[c.id] = cell;
            used.add(cell);
        }
    }
    localStorage.setItem('gpuPositions', JSON.stringify(saved));
    return result;
}

function savePositions() {
    const grid = document.getElementById('gpuGrid');
    const pos = {};
    grid.querySelectorAll('.card').forEach(el => {
        const cell = el.closest('[data-cell]');
        if (cell) pos[el.dataset.gpuId] = cell.dataset.cell;
    });
    // merge with any cards not currently rendered (shouldn't happen but safety)
    const existing = JSON.parse(localStorage.getItem('gpuPositions') || '{}');
    for (const k in existing) { if (!(k in pos)) pos[k] = existing[k]; }
    localStorage.setItem('gpuPositions', JSON.stringify(pos));
}

// ---- helpers ----

function tempClass(val) {
    if (val == null) return '';
    if (val >= 85) return 'temp-hot';
    if (val >= 65) return 'temp-warm';
    return 'temp-cool';
}

function formatBytes(bytes) {
    if (bytes == null) return 'N/A';
    const units = ['B', 'KiB', 'MiB', 'GiB'];
    let i = 0;
    let v = bytes;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return v.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

function createChart(canvasId, label, color) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    return new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{
            label, data: [],
            borderColor: color, backgroundColor: color + '22',
            borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: true,
        }] },
        options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: { x: { display: false }, y: { display: false, beginAtZero: true } },
        },
    });
}

function cardHTML(gpu) {
    const vramPct = gpu.vram_total > 0 ? (gpu.vram_used / gpu.vram_total * 100) : 0;
    const isMi50 = gpu.name && gpu.name.toLowerCase().includes('mi50');
    return `
    <div class="card" draggable="true" data-gpu-id="${gpu.id}">
        <div class="card-header">
            <div>
                <h2><span class="drag-handle">&#9776;</span>${gpu.id.toUpperCase()} <span class="badge">${isMi50 ? 'MI50' : (gpu.name.split('[')[0] || gpu.name)}</span></h2>
                <div class="sub">${gpu.name} ${gpu.sku ? '&middot; ' + gpu.sku : ''}</div>
            </div>
            <div class="updated">${gpu.timestamp ? new Date(gpu.timestamp).toLocaleTimeString() : ''}</div>
        </div>
        <div class="metrics">
            <div class="metric-box ${tempClass(gpu.temp_edge)}"><div class="label">Edge Temp</div><div class="value">${gpu.temp_edge != null ? gpu.temp_edge : 'N/A'} <span class="unit">°C</span></div></div>
            <div class="metric-box ${tempClass(gpu.temp_junction)}"><div class="label">Junction Temp</div><div class="value">${gpu.temp_junction != null ? gpu.temp_junction : 'N/A'} <span class="unit">°C</span></div></div>
            <div class="metric-box ${tempClass(gpu.temp_memory)}"><div class="label">Memory Temp</div><div class="value">${gpu.temp_memory != null ? gpu.temp_memory : 'N/A'} <span class="unit">°C</span></div></div>
            <div class="metric-box"><div class="label">Fan</div><div class="value">${gpu.fan_speed != null ? gpu.fan_speed : 'N/A'} <span class="unit">%</span></div></div>
        </div>
        <div class="bar-row"><div class="bar-label"><span>GPU Utilization</span><span>${gpu.gpu_use != null ? gpu.gpu_use + '%' : 'N/A'}</span></div><div class="bar-track"><div class="bar-fill blue" style="width:${gpu.gpu_use != null ? gpu.gpu_use : 0}%"></div></div></div>
        <div class="bar-row"><div class="bar-label"><span>VRAM</span><span>${formatBytes(gpu.vram_used)} / ${formatBytes(gpu.vram_total)} (${Math.round(vramPct)}%)</span></div><div class="bar-track"><div class="bar-fill ${vramPct > 80 ? 'red' : vramPct > 50 ? 'orange' : 'green'}" style="width:${vramPct}%"></div></div></div>
        <div style="display:flex; gap:12px;">
            <div style="flex:1"><div style="font-size:0.65rem;text-transform:uppercase;color:#8b949e;letter-spacing:0.5px;margin-bottom:2px;">Edge Temp</div><div class="chart-container"><canvas id="chart-${gpu.id}-edge"></canvas></div></div>
            <div style="flex:1"><div style="font-size:0.65rem;text-transform:uppercase;color:#8b949e;letter-spacing:0.5px;margin-bottom:2px;">GPU Use</div><div class="chart-container"><canvas id="chart-${gpu.id}-use"></canvas></div></div>
        </div>
        <div class="fan-row"><span>&#9881; Fan: ${gpu.fan_speed != null ? gpu.fan_speed + '%' : 'N/A'}</span><span>&#128347; RPM: ${gpu.fan_rpm != null ? gpu.fan_rpm : 'N/A'}</span></div>
    </div>`;
}

function dropZoneHTML(row, col) {
    return `<div class="drop-zone cell" data-cell="${row}-${col}" data-row="${row}" data-col="${col}">drop here</div>`;
}

// ---- drag-and-drop binding ----

function bindDragDrop(grid) {
    const items = grid.querySelectorAll('.card, .drop-zone');
    items.forEach(el => {
        el.addEventListener('dragstart', e => {
            if (!el.classList.contains('card')) { e.preventDefault(); return; }
            dragSrcId = el.dataset.gpuId;
            el.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });
        el.addEventListener('dragenter', e => e.preventDefault());
        el.addEventListener('dragover', e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            items.forEach(c => c.classList.remove('drag-over'));
            el.classList.add('drag-over');
        });
        el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
        el.addEventListener('drop', e => {
            e.preventDefault();
            items.forEach(c => c.classList.remove('drag-over', 'dragging'));
            const targetCell = el.dataset.cell || (el.closest('[data-cell]') && el.closest('[data-cell]').dataset.cell);
            if (!dragSrcId || !targetCell) { dragSrcId = null; return; }
            const pos = JSON.parse(localStorage.getItem('gpuPositions') || '{}');
            // find who currently owns targetCell, if anyone
            let occupant = null;
            for (const [id, cell] of Object.entries(pos)) {
                if (cell === targetCell) { occupant = id; break; }
            }
            if (occupant && occupant !== dragSrcId) {
                // swap
                const srcCell = pos[dragSrcId];
                pos[occupant] = srcCell;
                pos[dragSrcId] = targetCell;
            } else {
                pos[dragSrcId] = targetCell;
            }
            localStorage.setItem('gpuPositions', JSON.stringify(pos));
            dragSrcId = null;
            poll();
        });
        el.addEventListener('dragend', () => {
            dragSrcId = null;
            items.forEach(c => c.classList.remove('drag-over', 'dragging'));
        });
    });
}

// ---- render ----

function renderCards(cards) {
    for (const key in CHARTS) { CHARTS[key].destroy(); delete CHARTS[key]; }

    const positions = loadPositions(cards);
    const map = {};
    for (const c of cards) map[c.id] = c;

    // find max row
    let maxRow = 0;
    for (const cell of Object.values(positions)) {
        const r = parseInt(cell.split('-')[0], 10);
        if (r > maxRow) maxRow = r;
    }
    // ensure at least one extra empty row
    const rows = Math.max(maxRow + 1, 2);

    const grid = document.getElementById('gpuGrid');
    let html = '';
    for (let r = 1; r <= rows; r++) {
        for (let c = 1; c <= COLS; c++) {
            const cellKey = r + '-' + c;
            const gpuId = positions[cellKey];
            if (gpuId && map[gpuId]) {
                html += `<div class="cell" data-cell="${cellKey}">${cardHTML(map[gpuId])}</div>`;
            } else {
                html += dropZoneHTML(r, c);
            }
        }
    }
    grid.innerHTML = html;
    bindDragDrop(grid);

    // charts
    for (const c of cards) {
        ['edge', 'use'].forEach(sfx => {
            const id = 'chart-' + c.id + '-' + sfx;
            if (!CHARTS[id] && document.getElementById(id))
                CHARTS[id] = createChart(id, sfx === 'edge' ? 'Edge °C' : 'Use %', sfx === 'edge' ? '#58a6ff' : '#3fb950');
        });
    }
}

function updateCharts(cards) {
    for (const gpu of cards) {
        ['edge', 'use'].forEach(sfx => {
            const chart = CHARTS['chart-' + gpu.id + '-' + sfx];
            const key = sfx === 'edge' ? 'temp_edge' : 'gpu_use';
            if (chart && gpu.history && gpu.history[key]) {
                const pts = gpu.history[key];
                chart.data.labels = pts.map(p => p.t);
                chart.data.datasets[0].data = pts.map(p => p.v);
                chart.update('none');
            }
        });
    }
}

async function poll() {
    try {
        const res = await fetch('/api/gpus');
        const data = await res.json();
        renderCards(data);
        updateCharts(data);
        document.getElementById('updatedLabel').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (e) { console.error(e); }
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
